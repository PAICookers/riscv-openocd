on:
  push:
    branches:
      - main

name: OpenOCD Snapshot

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      DL_DIR: ../downloads
      BUILD_DIR: ../build
      LINUX_DEPS_PREFIX: /tmp/openocd-linux-x64-deps
      LIBUSB1_CONFIG: --enable-shared --disable-static
      HIDAPI_CONFIG: --enable-shared --disable-static --disable-testgui
      LIBFTDI_CONFIG: -DSTATICLIBS=OFF -DEXAMPLES=OFF -DFTDI_EEPROM=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      CAPSTONE_CONFIG: "CAPSTONE_BUILD_CORE_ONLY=yes CAPSTONE_STATIC=yes CAPSTONE_SHARED=no"
      LIBJAYLINK_CONFIG: --enable-shared --disable-static
      OPENOCD_CONFIG: --disable-werror --disable-xlnx-pcie-xvc
    steps:
      - name: Install needed packages
        run: |
          sudo apt-get update
          sudo apt-get install autotools-dev autoconf automake libtool pkg-config cmake texinfo texlive make gcc g++ g++-mingw-w64-x86-64 unzip patchelf

      - name: Checkout Code
        uses: actions/checkout@v6
      - run: ./bootstrap

      - name: Prepare libusb1
        env:
          LIBUSB1_VER: 1.0.26
        run: |
          mkdir -p "$DL_DIR" && cd "$DL_DIR"
          wget "https://github.com/libusb/libusb/releases/download/v${LIBUSB1_VER}/libusb-${LIBUSB1_VER}.tar.bz2"
          tar -xjf "libusb-${LIBUSB1_VER}.tar.bz2"
          echo "LIBUSB1_SRC=$PWD/libusb-${LIBUSB1_VER}" >> "$GITHUB_ENV"
      - name: Prepare hidapi
        env:
          HIDAPI_VER: 0.13.1
        run: |
          mkdir -p "$DL_DIR" && cd "$DL_DIR"
          wget "https://github.com/libusb/hidapi/archive/hidapi-${HIDAPI_VER}.tar.gz"
          tar -xzf "hidapi-${HIDAPI_VER}.tar.gz"
          cd "hidapi-hidapi-${HIDAPI_VER}"
          ./bootstrap
          echo "HIDAPI_SRC=$PWD" >> "$GITHUB_ENV"
      - name: Prepare libftdi
        env:
          LIBFTDI_VER: 1.5
        run: |
          mkdir -p "$DL_DIR" && cd "$DL_DIR"
          wget "http://www.intra2net.com/en/developer/libftdi/download/libftdi1-${LIBFTDI_VER}.tar.bz2"
          tar -xjf "libftdi1-${LIBFTDI_VER}.tar.bz2"
          echo "LIBFTDI_SRC=$PWD/libftdi1-${LIBFTDI_VER}" >> "$GITHUB_ENV"
      - name: Prepare capstone
        env:
          CAPSTONE_VER: 4.0.2
        run: |
          mkdir -p "$DL_DIR" && cd "$DL_DIR"
          wget "https://github.com/aquynh/capstone/archive/${CAPSTONE_VER}.tar.gz"
          tar -xzf "${CAPSTONE_VER}.tar.gz"
          echo "CAPSTONE_SRC=$PWD/capstone-${CAPSTONE_VER}" >> "$GITHUB_ENV"

      - name: Prepare libjaylink
        env:
          LIBJAYLINK_VER: 0.3.1
        run: |
          mkdir -p "$DL_DIR" && cd "$DL_DIR"
          wget "https://gitlab.zapb.de/libjaylink/libjaylink/-/archive/${LIBJAYLINK_VER}/libjaylink-${LIBJAYLINK_VER}.tar.gz"
          tar -xzf "libjaylink-${LIBJAYLINK_VER}.tar.gz"
          cd "libjaylink-${LIBJAYLINK_VER}"
          ./autogen.sh
          echo "LIBJAYLINK_SRC=$PWD" >> "$GITHUB_ENV"

      - name: Build Linux x64 fixed dependencies
        shell: bash
        run: |
          LINUX_DEPS_BUILD_DIR="$BUILD_DIR/linux-x64-deps"
          rm -rf "$LINUX_DEPS_PREFIX" "$LINUX_DEPS_BUILD_DIR"
          mkdir -p "$LINUX_DEPS_BUILD_DIR"

          build_autotools_dep() {
            local name="$1"
            local src="$2"
            shift 2

            mkdir -p "$LINUX_DEPS_BUILD_DIR/$name"
            (
              cd "$LINUX_DEPS_BUILD_DIR/$name"
              "$src/configure" --prefix="$LINUX_DEPS_PREFIX" "$@"
              make -j"$(nproc)"
              make install-strip
            )
          }

          build_autotools_dep libusb1 "$LIBUSB1_SRC" \
            $LIBUSB1_CONFIG \
            --disable-udev

          export PKG_CONFIG_PATH="$LINUX_DEPS_PREFIX/lib/pkgconfig:$LINUX_DEPS_PREFIX/lib64/pkgconfig"
          export CPPFLAGS="-I$LINUX_DEPS_PREFIX/include -I$LINUX_DEPS_PREFIX/include/libusb-1.0"
          export LDFLAGS="-L$LINUX_DEPS_PREFIX/lib -L$LINUX_DEPS_PREFIX/lib64"

          mkdir -p "$LINUX_DEPS_BUILD_DIR/libftdi"
          (
            cd "$LINUX_DEPS_BUILD_DIR/libftdi"
            cmake \
              -DCMAKE_INSTALL_PREFIX="$LINUX_DEPS_PREFIX" \
              -DCMAKE_PREFIX_PATH="$LINUX_DEPS_PREFIX" \
              -DPKG_CONFIG_EXECUTABLE="$(command -v pkg-config)" \
              $LIBFTDI_CONFIG \
              "$LIBFTDI_SRC"
            cmake --build . -j"$(nproc)"
            cmake --install . --strip
          )

          build_autotools_dep libjaylink "$LIBJAYLINK_SRC" \
            $LIBJAYLINK_CONFIG

      - name: Package OpenOCD for Linux x64
        shell: bash
        run: |
          OPENOCD_TAG="$(git tag --points-at HEAD)"
          [ -z "$OPENOCD_TAG" ] && OPENOCD_TAG="$(git rev-parse --short HEAD)"

          RELEASE_NAME="$(git tag --points-at HEAD)"
          [ -z "$RELEASE_NAME" ] && RELEASE_NAME="latest"
          [[ "$RELEASE_NAME" = "latest" ]] && IS_PRE_RELEASE="true" || IS_PRE_RELEASE="false"

          LINUX_PREFIX="/tmp/openocd-linux-x64-${OPENOCD_TAG}"
          LINUX_ARTIFACT="$GITHUB_WORKSPACE/openocd-${OPENOCD_TAG}-linux-x64.tar.gz"
          LINUX_BUILD_DIR="$BUILD_DIR/linux-x64-openocd"

          rm -rf "$LINUX_PREFIX" "$LINUX_BUILD_DIR"
          mkdir -p "$LINUX_BUILD_DIR"

          export PKG_CONFIG_PATH="$LINUX_DEPS_PREFIX/lib/pkgconfig:$LINUX_DEPS_PREFIX/lib64/pkgconfig"
          export CPPFLAGS="-I$LINUX_DEPS_PREFIX/include -I$LINUX_DEPS_PREFIX/include/libusb-1.0"
          export LDFLAGS="-L$LINUX_DEPS_PREFIX/lib -L$LINUX_DEPS_PREFIX/lib64"

          (
            cd "$LINUX_BUILD_DIR"
            "$GITHUB_WORKSPACE/configure" \
              --prefix="$LINUX_PREFIX" \
              --enable-remote-bitbang \
              --enable-jtag_vpi \
              --enable-ftdi-cjtag \
              --enable-jlink \
              --enable-ftdi \
              $OPENOCD_CONFIG

            make -j"$(nproc)"
            make install-strip
          )

          find "$LINUX_DEPS_PREFIX/lib" "$LINUX_DEPS_PREFIX/lib64" -maxdepth 1 \
            \( -name 'libusb-1.0.so*' -o -name 'libftdi1.so*' -o -name 'libjaylink.so*' \) \
            -exec cp -a {} "$LINUX_PREFIX/bin/" \; 2>/dev/null || true
          patchelf --set-rpath '$ORIGIN' "$LINUX_PREFIX/bin/openocd"

          tar -C /tmp -czf "$LINUX_ARTIFACT" "$(basename "$LINUX_PREFIX")"
          echo "OPENOCD_TAG=$OPENOCD_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"
          echo "IS_PRE_RELEASE=$IS_PRE_RELEASE" >> "$GITHUB_ENV"
          echo "LINUX_ARTIFACT_PATH=$LINUX_ARTIFACT" >> "$GITHUB_ENV"

      - name: Prepare FTD2XX
        env:
          FTD2XX_VER: 2.12.36.4
        run: |
          mkdir -p "$DL_DIR" && cd "$DL_DIR"
          FTD2XX_FOLDER="ftd2XX-${FTD2XX_VER}"
          wget "https://ftdichip.com/wp-content/uploads/2023/09/CDM-v${FTD2XX_VER}-WHQL-Certified.zip"
          unzip -d "$FTD2XX_FOLDER" "CDM-v${FTD2XX_VER}-WHQL-Certified.zip"
          echo "FTD2XX_SRC=$PWD/${FTD2XX_FOLDER}" >> "$GITHUB_ENV"

      - name: Package OpenOCD for windows x64
        env:
          MAKE_JOBS: 2
          HOST: x86_64-w64-mingw32
        run: |
          export OPENOCD_TAG="$OPENOCD_TAG"
          export OPENOCD_SRC="$PWD"

          mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          bash "$OPENOCD_SRC/contrib/cross-build.sh" "$HOST"
          cd "$HOST-root/usr"
          cp "$(${HOST}-gcc --print-file-name=libwinpthread-1.dll)" ./bin/ || true
          cp "$(${HOST}-gcc --print-file-name=libgcc_s_seh-1.dll)" ./bin/ || true

          WIN_ARTIFACT="openocd-${OPENOCD_TAG}-windows-x64.tar.gz"
          tar -czf "$WIN_ARTIFACT" *
          echo "WIN_ARTIFACT_PATH=$PWD/$WIN_ARTIFACT" >> "$GITHUB_ENV"

      - name: Publish packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          path: |
            ${{ env.LINUX_ARTIFACT_PATH }}
            ${{ env.WIN_ARTIFACT_PATH }}
      - name: Delete previous release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: ${{ env.RELEASE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_NAME }}
          commit: ${{ github.sha }}
          draft: false
          artifacts: ${{ env.LINUX_ARTIFACT_PATH }},${{ env.WIN_ARTIFACT_PATH }}
          prerelease: ${{ env.IS_PRE_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
